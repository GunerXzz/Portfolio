<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4800"/>
      <stop offset="100%" stop-color="#ff884d"/>
    </linearGradient>

    <filter id="box-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .arch-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .arch-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; fill: #a1a1aa; }
    .arch-tech { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #ff4800; }
    .node-header { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #71717a; letter-spacing: 1.5px; text-transform: uppercase; }
  </style>

  <!-- Container -->
  <rect width="900" height="240" rx="16" fill="#070709" stroke="#27272a" stroke-width="1"/>

  <!-- Top Bar -->
  <g transform="translate(35, 26)">
    <circle cx="0" cy="0" r="3.5" fill="#ff4800"/>
    <text x="12" y="3.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ff4800" letter-spacing="1.5px">SYSTEM ARCHITECTURE // PRODUCTION PIPELINE</text>
    <text x="830" y="3.5" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">NUXT 3 • VUE 3 • I18N • TAILWIND</text>
  </g>

  <!-- 4 Architectural Pillars -->
  <!-- Box 1: Presentation Layer -->
  <g transform="translate(35, 52)">
    <rect width="190" height="150" rx="12" fill="url(#box-grad)" stroke="#27272a"/>
    <text x="18" y="26" class="node-header">01 // FRONT-END</text>
    <text x="18" y="48" class="arch-title">Nuxt 3 &amp; Vue 3</text>
    <text x="18" y="70" class="arch-sub">SSR &amp; SPA Cashier UI</text>
    <text x="18" y="88" class="arch-sub">Tailwind Styling</text>
    <text x="18" y="106" class="arch-sub">Reactive Order Basket</text>
    <line x1="18" y1="120" x2="172" y2="120" stroke="#1f1f23"/>
    <text x="18" y="136" class="arch-tech">Composition API</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 235 127 L 253 127" stroke="#ff4800" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="253,124 259,127 253,130" fill="#ff4800"/>

  <!-- Box 2: Localization & Theme Layer -->
  <g transform="translate(265, 52)">
    <rect width="190" height="150" rx="12" fill="url(#box-grad)" stroke="#27272a"/>
    <text x="18" y="26" class="node-header">02 // LOCALE &amp; UX</text>
    <text x="18" y="48" class="arch-title">i18n &amp; Theming</text>
    <text x="18" y="70" class="arch-sub">@nuxtjs/i18n Engine</text>
    <text x="18" y="88" class="arch-sub">Khmer &amp; English Switch</text>
    <text x="18" y="106" class="arch-sub">Dynamic Dark/Light Mode</text>
    <line x1="18" y1="120" x2="172" y2="120" stroke="#1f1f23"/>
    <text x="18" y="136" class="arch-tech">@nuxtjs/color-mode</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 465 127 L 483 127" stroke="#ff4800" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="483,124 489,127 483,130" fill="#ff4800"/>

  <!-- Box 3: Inventory Engine -->
  <g transform="translate(495, 52)">
    <rect width="190" height="150" rx="12" fill="url(#box-grad)" stroke="#27272a"/>
    <text x="18" y="26" class="node-header">03 // CORE ENGINE</text>
    <text x="18" y="48" class="arch-title">Inventory &amp; POS</text>
    <text x="18" y="70" class="arch-sub">Barcode/SKU Matching</text>
    <text x="18" y="88" class="arch-sub">Stock Audit &amp; Alerts</text>
    <text x="18" y="106" class="arch-sub">Real-Time Receipts</text>
    <line x1="18" y1="120" x2="172" y2="120" stroke="#1f1f23"/>
    <text x="18" y="136" class="arch-tech">Pinia State Store</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 695 127 L 713 127" stroke="#ff4800" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="713,124 719,127 713,130" fill="#ff4800"/>

  <!-- Box 4: Database & ACID Layer -->
  <g transform="translate(725, 52)">
    <rect width="140" height="150" rx="12" fill="url(#box-grad)" stroke="#ff4800" stroke-width="1.2"/>
    <text x="16" y="26" class="node-header">04 // PERSISTENCE</text>
    <text x="16" y="48" class="arch-title">Relational DB</text>
    <text x="16" y="70" class="arch-sub">ACID Transact.</text>
    <text x="16" y="88" class="arch-sub">MySQL / Postgres</text>
    <text x="16" y="106" class="arch-sub">Indexed Lookups</text>
    <line x1="16" y1="120" x2="124" y2="120" stroke="#1f1f23"/>
    <text x="16" y="136" class="arch-tech">Audit Logs</text>
  </g>
</svg>
