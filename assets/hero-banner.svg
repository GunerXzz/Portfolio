<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Dark luxury linear gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4800"/>
      <stop offset="50%" stop-color="#ff7733"/>
      <stop offset="100%" stop-color="#ff2200"/>
    </linearGradient>

    <linearGradient id="text-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 44px; fill: url(#text-mask); letter-spacing: -1.5px; }
    .highlight { fill: #ff4800; font-style: normal; }
    .badge { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #ff4800; letter-spacing: 2px; text-transform: uppercase; }
    .subtitle { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 14px; fill: #a1a1aa; font-weight: 400; }
    .mono-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #71717a; letter-spacing: 1.5px; text-transform: uppercase; }
    .border-line { stroke: #27272a; stroke-width: 1; }
    .accent-dot { fill: #ff4800; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="260" rx="20" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="50" r="90" fill="#ff4800" opacity="0.16" filter="url(#glow)"/>
  <circle cx="820" cy="200" r="110" fill="#ff4800" opacity="0.10" filter="url(#glow)"/>
  <circle cx="500" cy="130" r="70" fill="#e11d48" opacity="0.08" filter="url(#subtle-blur)"/>

  <!-- Outer Glass Border -->
  <rect x="0.5" y="0.5" width="899" height="259" rx="20" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Grid Blueprint Lines -->
  <line x1="50" y1="0" x2="50" y2="260" stroke="#18181b" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="850" y1="0" x2="850" y2="260" stroke="#18181b" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#18181b" stroke-width="1"/>
  <line x1="0" y1="210" x2="900" y2="210" stroke="#18181b" stroke-width="1"/>

  <!-- Top Metadata Bar -->
  <circle cx="50" cy="28" r="3.5" class="accent-dot"/>
  <text x="64" y="32" class="badge">STUDIO DOSSIER // EDITORIAL GALLERY</text>
  <text x="850" y="32" text-anchor="end" class="mono-meta">11.5564° N, 104.9282° E • PHNOM PENH</text>

  <!-- Main Statement -->
  <text x="50" y="112" class="title">
    SOK CHANMONY <tspan class="highlight">//</tspan> GUNERXZZ
  </text>
  
  <text x="50" y="148" class="subtitle">
    Full-Stack Web Architect &amp; Visual Art Director crafting reactive systems &amp; avant-garde typography.
  </text>

  <!-- Discipline Chips -->
  <g transform="translate(50, 168)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#18181b" stroke="#27272a"/>
    <text x="67" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e4e4e7" font-weight="600">Nuxt 3 &amp; Vue 3</text>
    
    <!-- Pill 2 -->
    <rect x="145" y="0" width="140" height="24" rx="12" fill="#18181b" stroke="#27272a"/>
    <text x="215" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e4e4e7" font-weight="600">Next.js 14 &amp; React</text>
    
    <!-- Pill 3 -->
    <rect x="295" y="0" width="140" height="24" rx="12" fill="#18181b" stroke="#27272a"/>
    <text x="365" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e4e4e7" font-weight="600">PHP 8.3 &amp; Laravel</text>
    
    <!-- Pill 4 -->
    <rect x="445" y="0" width="170" height="24" rx="12" fill="#ff4800" opacity="0.15" stroke="#ff4800"/>
    <text x="530" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff4800" font-weight="700">Khmer Poster Typography</text>
  </g>

  <!-- Bottom Ticker Line -->
  <text x="50" y="235" class="mono-meta">FACULTY OF SCIENCE &amp; TECH • 4TH YEAR CS SENIOR</text>
  <text x="850" y="235" text-anchor="end" class="mono-meta">STATUS: AVAILABLE FOR JUNIOR ROLES &amp; FREELANCE</text>
  <circle cx="840" cy="232" r="3" fill="#10b981"/>
</svg>
